<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Живой путь — Панель управления</title>
  <base href="/admin/" />

  <!-- ─── Auth guard ───────────────────────────────────────────────
       Client-side gate: redirect to login if the visitor is not an admin.
       NOTE: this is a convenience lock, not real security. On a static
       site anyone can read the JS. For true protection, enable Vercel
       Deployment Protection (password) on the /admin path. -->
  <script src="../js/auth.js"></script>
  <script>
    if (!window.ZhivoyAuth || !window.ZhivoyAuth.isAdmin()) {
      window.location.replace('../pages/login.html?redirect=admin');
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin-vars.css" />
  <link rel="stylesheet" href="css/admin-layout.css" />
  <link rel="stylesheet" href="css/admin-forms.css" />
  <link rel="stylesheet" href="css/admin-components.css" />
  <link rel="stylesheet" href="css/admin-utils.css" />
  <link rel="stylesheet" href="css/admin-visual.css" />
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
  <!-- Pickr color picker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" />
</head>
<body>

  <!-- Mobile sidebar toggle button -->
  <button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <aside class="sidebar">

      <div class="mark">✦</div>
      Живой путь
      <span>CMS</span>
    </div>
    <div id="sidebar-nav-container"></div>
    <div class="sidebar-footer">
      <a href="editor.html" class="sidebar-builder-link">&#9998; Конструктор страниц</a>

      </div>
    </div>
    <div class="content" id="content-area">
      <div id="panels-container"></div>
    </div>

  <!-- Toast notification -->
  <div id="toast">✓ Сохранено</div>

  <!-- Quill.js -->

  <!-- SortableJS — drag-drop lists -->

  <!-- Pickr — professional color picker -->

  <!-- Chart.js — admin analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

  <!-- Monaco Editor loader (lazy — activated in code panel) -->

  <!-- Supabase -->

    AdminStore.loadFromCloud();
  </script>
