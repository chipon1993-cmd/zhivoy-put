<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <meta name="theme-color" content="#f2c96d" />
  <title>Навигатор — Живой путь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/atmosphere.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/navigator.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="atmosphere"></div>
  <div class="grid-overlay"></div>
  <div class="noise"></div>

  <div class="page">
    <div id="site-header"></div>

    <main class="nav-page">

      <!-- ═══ Streak Bar ═══ -->
      <div class="streak-bar reveal">
        <span class="streak-fire">🔥</span>
        <span class="streak-count" id="streak-count">0</span>
        <span class="streak-label">дней подряд</span>
      </div>

      <!-- ═══ Tabs ═══ -->
      <div class="nav-tabs reveal">
        <button class="nav-tab active" data-tab="checkin">📝 Чекин</button>
        <button class="nav-tab" data-tab="breathe">🫁 Дыхание</button>
        <button class="nav-tab" data-tab="journal">📖 Дневник</button>
      </div>

      <!-- ═══════════ TAB: CHECK-IN ═══════════ -->
      <div class="tab-panel active" id="panel-checkin">
        <div class="checkin-section">

          <h3 style="font-size:18px;margin-bottom:6px;color:var(--text);">Как ты сейчас?</h3>
          <p style="font-size:14px;color:var(--muted);margin-bottom:1.5rem;">Выбери состояние и/или напиши потоком</p>

          <!-- Mood selector -->
          <div class="mood-grid">
            <button class="mood-btn" data-mood="heavy">
              <span class="mood-emoji">😔</span>
              <span class="mood-label">Тяжесть</span>
            </button>
            <button class="mood-btn" data-mood="anxious">
              <span class="mood-emoji">😰</span>
              <span class="mood-label">Тревога</span>
            </button>
            <button class="mood-btn" data-mood="fog">
              <span class="mood-emoji">🌫️</span>
              <span class="mood-label">Туман</span>
            </button>
            <button class="mood-btn" data-mood="spark">
              <span class="mood-emoji">✨</span>
              <span class="mood-label">Искра</span>
            </button>
            <button class="mood-btn" data-mood="calm">
              <span class="mood-emoji">😌</span>
              <span class="mood-label">Спокойствие</span>
            </button>
          </div>

          <!-- Text input -->
          <textarea class="checkin-textarea" id="checkin-text" placeholder="Пиши потоком: что чувствуешь, что давит, где туман, где есть маленькая искра..."></textarea>

          <!-- Actions -->
          <div class="checkin-actions">
            <button class="checkin-submit" id="checkin-submit">Сохранить запись</button>
            <button class="reflect-btn" id="checkin-reflect">✦ Отражение</button>
          </div>

          <!-- Reflection output -->
          <div class="reflection-box" id="reflection-box"></div>

        </div>
      </div>

      <!-- ═══════════ TAB: BREATHING ═══════════ -->
      <div class="tab-panel" id="panel-breathe">
        <div class="breath-container">

          <h3 style="font-size:18px;margin-bottom:8px;color:var(--text);">Дыхательная практика</h3>
          <p style="font-size:14px;color:var(--muted);margin-bottom:2rem;text-align:center;">4 секунды вдох · 2 задержка · 4 выдох<br>6 циклов = 1 минута присутствия</p>

          <div class="breath-circle" id="breath-circle">
            <span class="breath-text" id="breath-text">Готов</span>
          </div>

          <div class="breath-timer" id="breath-timer">Нажми для начала</div>
          <button class="breath-btn" id="breath-start">Начать дыхание</button>

        </div>
      </div>

      <!-- ═══════════ TAB: JOURNAL ═══════════ -->
      <div class="tab-panel" id="panel-journal">
        <div class="journal-section">

          <!-- Mood chart -->
          <div class="mood-chart">
            <div class="mood-chart-title">Настроение за 7 дней</div>
            <div class="mood-chart-bars" id="mood-chart-bars"></div>
            <div class="mood-chart-labels" id="mood-chart-labels"></div>
          </div>

          <!-- Entries list -->
          <h3 style="font-size:16px;margin:1.5rem 0 1rem;color:var(--text);">История записей</h3>
          <div class="journal-list" id="journal-list"></div>

        </div>
      </div>

    </main>

    <div id="site-footer"></div>
  </div>

  <script src="../js/scroll-perf.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/starfield.js"></script>
  <script src="../js/scroll-effects.js"></script>
  <script src="../js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/cms-loader.js"></script>
  <script src="../js/navigator-engine.js"></script>
</body>
</html>
